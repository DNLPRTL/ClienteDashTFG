<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- Fila 1: lo que es real y lo que se emula -->
  <rect x="20" y="20" width="280" height="110" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="160" y="46" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Servidor web real</text>
  <text x="160" y="70" font-size="13" fill="#212529" text-anchor="middle">contenido DASH con tasa variable</text>
  <text x="160" y="92" font-size="13" fill="#212529" text-anchor="middle">6 calidades, segmentos de 4 s</text>
  <text x="160" y="114" font-size="13" fill="#212529" text-anchor="middle">tamaño real de cada segmento</text>

  <line x1="300" y1="75" x2="338" y2="75" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>

  <rect x="340" y="20" width="280" height="110" rx="6" fill="#ffffff" stroke="#868e96" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="480" y="46" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Red emulada</text>
  <text x="480" y="70" font-size="13" fill="#212529" text-anchor="middle">trazas de ancho de banda de redes reales</text>
  <text x="480" y="92" font-size="13" fill="#212529" text-anchor="middle">misma secuencia para todos los controladores</text>
  <text x="480" y="114" font-size="13" fill="#212529" text-anchor="middle">sin fuentes comunes con el entrenamiento</text>

  <line x1="620" y1="75" x2="658" y2="75" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>

  <rect x="660" y="20" width="280" height="110" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="800" y="46" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Cliente DASH propio</text>
  <text x="800" y="70" font-size="13" fill="#212529" text-anchor="middle">manifiesto, descarga y buffer</text>
  <text x="800" y="92" font-size="13" fill="#212529" text-anchor="middle">motor real o simulado, mismos tiempos</text>
  <text x="800" y="114" font-size="13" fill="#212529" text-anchor="middle">telemetría de cada decisión</text>

  <!-- Conexion cliente -> interfaz -->
  <line x1="800" y1="130" x2="800" y2="158" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>

  <!-- Fila 2: interfaz comun y controladores -->
  <rect x="340" y="160" width="600" height="140" rx="6" fill="#ffffff" stroke="#868e96" stroke-width="1.2"/>
  <text x="640" y="184" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Interfaz común de controladores: misma información para todos</text>

  <rect x="356" y="198" width="180" height="86" rx="4" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>
  <text x="446" y="220" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">4 clásicos de referencia</text>
  <text x="446" y="242" font-size="12.5" fill="#495057" text-anchor="middle">basado en tasa, en buffer,</text>
  <text x="446" y="260" font-size="12.5" fill="#495057" text-anchor="middle">en utilidad y MPC robusto</text>
  <text x="446" y="278" font-size="12.5" fill="#495057" text-anchor="middle">parámetros publicados</text>

  <rect x="550" y="198" width="200" height="86" rx="4" fill="#ffffff" stroke="#1971c2" stroke-width="1.8"/>
  <text x="650" y="220" font-size="13" font-weight="bold" fill="#1971c2" text-anchor="middle">Controlador propio</text>
  <text x="650" y="242" font-size="12.5" fill="#212529" text-anchor="middle">predictor de cuantiles del</text>
  <text x="650" y="260" font-size="12.5" fill="#212529" text-anchor="middle">ancho de banda + planificador</text>
  <text x="650" y="278" font-size="12.5" fill="#212529" text-anchor="middle">MPC con medida de riesgo</text>

  <rect x="764" y="198" width="160" height="86" rx="4" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>
  <text x="844" y="220" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">3 variantes</text>
  <text x="844" y="242" font-size="12.5" fill="#495057" text-anchor="middle">del controlador propio,</text>
  <text x="844" y="260" font-size="12.5" fill="#495057" text-anchor="middle">cada una sin una pieza,</text>
  <text x="844" y="278" font-size="12.5" fill="#495057" text-anchor="middle">para medir lo que aporta</text>

  <!-- Entorno de entrenamiento (fuera de linea) -->
  <rect x="20" y="160" width="280" height="140" rx="6" fill="#ffffff" stroke="#868e96" stroke-width="1.2"/>
  <text x="160" y="184" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Entrenamiento fuera de línea</text>
  <text x="160" y="210" font-size="13" fill="#212529" text-anchor="middle">simulador de sesiones con los</text>
  <text x="160" y="230" font-size="13" fill="#212529" text-anchor="middle">tamaños reales de los segmentos</text>
  <text x="160" y="254" font-size="13" fill="#212529" text-anchor="middle">trazas de entrenamiento, separadas</text>
  <text x="160" y="274" font-size="13" fill="#212529" text-anchor="middle">de las de evaluación por fuente</text>
  <text x="160" y="294" font-size="12" fill="#1971c2" text-anchor="middle">solo aprende la predicción, no la decisión</text>

  <polyline points="300,230 322,230 322,292 650,292 650,287" fill="none" stroke="#495057" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flecha)"/>

  <!-- Fila 3: evaluacion prerregistrada -->
  <rect x="20" y="330" width="280" height="80" rx="6" fill="#fff9db" stroke="#868e96" stroke-width="1.2"/>
  <text x="160" y="356" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Protocolo fijado antes</text>
  <text x="160" y="378" font-size="13" fill="#212529" text-anchor="middle">controladores, ventanas, vídeos,</text>
  <text x="160" y="398" font-size="13" fill="#212529" text-anchor="middle">métricas, hipótesis y pruebas estadísticas</text>

  <line x1="300" y1="370" x2="338" y2="370" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>

  <rect x="340" y="330" width="280" height="80" rx="6" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
  <text x="480" y="356" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle">Experimento ejecutado una sola vez</text>
  <text x="480" y="378" font-size="13" fill="#212529" text-anchor="middle">código congelado con sus huellas,</text>
  <text x="480" y="398" font-size="13" fill="#212529" text-anchor="middle">máquina virtual dedicada</text>

  <line x1="620" y1="370" x2="658" y2="370" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>

  <rect x="660" y="330" width="280" height="80" rx="6" fill="#fff9db" stroke="#868e96" stroke-width="1.2"/>
  <text x="800" y="356" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Paquete de evidencia verificable</text>
  <text x="800" y="378" font-size="13" fill="#212529" text-anchor="middle">telemetría, resultados y huellas;</text>
  <text x="800" y="398" font-size="13" fill="#212529" text-anchor="middle">de él salen las tablas y figuras del capítulo 6</text>

  <!-- Conexion interfaz -> experimento -->
  <line x1="480" y1="300" x2="480" y2="328" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>
</svg>
