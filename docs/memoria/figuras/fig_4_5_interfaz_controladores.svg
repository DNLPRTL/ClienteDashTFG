<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f5flecha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="f5gris" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="620" fill="#ffffff"/>

  <!-- ============ Reproductor ============ -->
  <rect x="40" y="90" width="180" height="130" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="130" y="120" font-size="13.5" fill="#1864ab" text-anchor="middle" font-weight="bold">Reproductor</text>
  <text x="130" y="142" font-size="10.5" fill="#495057" text-anchor="middle">construye la realimentación</text>
  <text x="130" y="157" font-size="10.5" fill="#495057" text-anchor="middle">en cada segmento</text>
  <text x="130" y="180" font-size="10.5" fill="#495057" text-anchor="middle">cuantiza la tasa elegida</text>
  <text x="130" y="195" font-size="10.5" fill="#495057" text-anchor="middle">al nivel de la escalera</text>

  <!-- ============ contrato (centro superior) ============ -->
  <rect x="280" y="40" width="380" height="120" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="8"/>
  <text x="470" y="62" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">Contrato de realimentación (20 claves fijas)</text>
  <text x="296" y="84" font-size="10.5" fill="#495057">· Estado del buffer (tiempo y bytes en cola)</text>
  <text x="296" y="102" font-size="10.5" fill="#495057">· Escalera de calidades (tasas, nivel actual, máx/mín)</text>
  <text x="296" y="120" font-size="10.5" fill="#495057">· Última descarga (tamaño, tiempo, ancho de banda observado)</text>
  <text x="296" y="138" font-size="10.5" fill="#495057">· Progreso de la sesión (segmento actual, total, acumulados)</text>

  <!-- flecha realimentacion -->
  <path d="M 220 120 H 250 V 100 H 280" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <path d="M 660 100 H 690 V 120 H 720" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <text x="236" y="92" font-size="10.5" fill="#1971c2">1.</text>

  <!-- ============ Controlador ============ -->
  <rect x="720" y="90" width="180" height="130" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="810" y="120" font-size="13.5" fill="#1864ab" text-anchor="middle" font-weight="bold">Controlador ABR</text>
  <text x="810" y="142" font-size="10.5" fill="#495057" text-anchor="middle">recibe la realimentación</text>
  <text x="810" y="160" font-size="10.5" fill="#495057" text-anchor="middle">calcula la acción de control</text>
  <text x="810" y="178" font-size="10.5" fill="#495057" text-anchor="middle">= tasa objetivo (valor</text>
  <text x="810" y="193" font-size="10.5" fill="#495057" text-anchor="middle">continuo, bytes/s)</text>

  <!-- flecha decision -->
  <path d="M 720 190 H 500 " fill="none" stroke="#1971c2" stroke-width="1.6"/>
  <path d="M 500 190 H 220" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <text x="470" y="182" font-size="10.5" fill="#1971c2" text-anchor="middle">2. tasa objetivo</text>
  <text x="292" y="207" font-size="10.5" fill="#495057">3. cuantización común: escalón más alto ≤ objetivo</text>

  <!-- ============ excluido ============ -->
  <rect x="40" y="260" width="400" height="130" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.4" rx="8"/>
  <text x="240" y="284" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="bold">Excluido del contrato (por construcción)</text>
  <text x="60" y="308" font-size="10.5" fill="#495057">· identidad de la traza de red reproducida</text>
  <text x="60" y="326" font-size="10.5" fill="#495057">· partición experimental (entrenamiento / evaluación)</text>
  <text x="60" y="344" font-size="10.5" fill="#495057">· dificultad o etiquetas de la ventana</text>
  <text x="60" y="362" font-size="10.5" fill="#495057">· throughput futuro</text>
  <text x="240" y="382" font-size="10" fill="#c92a2a" text-anchor="middle" font-style="italic">el controlador solo ve lo que vería en un despliegue real</text>

  <!-- ============ registro ============ -->
  <rect x="500" y="260" width="400" height="130" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="8"/>
  <text x="700" y="284" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">Registro de controladores (clave → fábrica)</text>
  <text x="520" y="308" font-size="10.5" fill="#495057">basado_en_tasa · bba · bola · mpc · mpc_robusto ·</text>
  <text x="520" y="324" font-size="10.5" fill="#1864ab" font-weight="bold">controlador_propio</text>
  <text x="520" y="348" font-size="10.5" fill="#495057">la configuración elige por nombre y pasa los parámetros;</text>
  <text x="520" y="364" font-size="10.5" fill="#495057">añadir un algoritmo = implementar la interfaz + registrarlo</text>

  <!-- ============ salvaguardas ============ -->
  <rect x="40" y="430" width="860" height="130" fill="#fff9db" stroke="#b08d00" stroke-width="1.4" rx="8"/>
  <text x="470" y="456" font-size="12" fill="#846200" text-anchor="middle" font-weight="bold">Salvaguardas para controladores con modelo aprendido</text>
  <rect x="70" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="195" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold">Máscara de acciones</text>
  <text x="195" y="510" font-size="10" fill="#495057" text-anchor="middle">la acción debe ser una representación</text>
  <text x="195" y="524" font-size="10" fill="#495057" text-anchor="middle">existente y permitida</text>
  <rect x="345" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="470" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold">Respaldo clásico</text>
  <text x="470" y="510" font-size="10" fill="#495057" text-anchor="middle">si el modelo falla o excede la latencia,</text>
  <text x="470" y="524" font-size="10" fill="#495057" text-anchor="middle">decide un controlador clásico y se anota</text>
  <rect x="620" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="745" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold">Integridad del modelo</text>
  <text x="745" y="510" font-size="10" fill="#495057" text-anchor="middle">verificación del paquete del modelo</text>
  <text x="745" y="524" font-size="10" fill="#495057" text-anchor="middle">en la carga</text>
  <text x="470" y="586" font-size="10.5" fill="#846200" text-anchor="middle" font-style="italic">principio: un controlador aprendido nunca puede invalidar una sesión; cada decisión queda auditada en la telemetría</text>
</svg>
