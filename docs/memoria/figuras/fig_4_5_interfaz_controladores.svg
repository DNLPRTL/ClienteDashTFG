<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Helvetica, Arial, sans-serif" xmlns:bx="https://boxy-svg.com">
  <defs>
    <marker id="f5flecha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <bx:export>
      <bx:file format="jpeg" path="Sin título.jpeg"/>
    </bx:export>
  </defs>
  <rect x="0" y="0" width="940" height="620" fill="#ffffff"/>
  <rect x="40" y="90" width="180" height="130" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="130" y="120" font-size="13.5" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">Reproductor</text>
  <text x="130" y="142" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">crea la realimentación</text>
  <text x="130" y="157" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">para cada segmento</text>
  <text x="130" y="180" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">convierte la tasa escogida</text>
  <text x="130" y="195" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">al nivel de la escalera correspondiente</text>
  <rect x="280" y="40" width="380" height="120" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="8"/>
  <text x="470" y="62" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Contrato de realimentación </text>
  <text x="296" y="84" font-size="10.5" fill="#495057" style="white-space: pre;">· Estado del buffer (tsegundos y bytes en la cola)</text>
  <text x="296" y="102" font-size="10.5" fill="#495057" style="white-space: pre;">· Escalera de calidades (tasas disponibles, tasa y nivel actual...)</text>
  <text x="296" y="120" font-size="10.5" fill="#495057" style="white-space: pre;">· Última descarga (tamaño, tiempo, ancho de banda, instante de petición)</text>
  <text x="296" y="138" font-size="10.5" fill="#495057" style="white-space: pre;">· Estado de la sesión (segmento actual, segmentos totales, bytes totales)</text>
  <path d="M 220 120 H 250 V 100 H 280" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <path d="M 660 100 H 690 V 120 H 720" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <text x="236" y="92" font-size="10.5" fill="#1971c2" style="white-space: pre;">1.</text>
  <rect x="720" y="90" width="180" height="130" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="810" y="120" font-size="13.5" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">Controlador ABR</text>
  <text x="810" y="142" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">recibe la realimentación y</text>
  <text x="810" y="160" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">calcula la acción </text>
  <text x="810" y="178" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">= tasa objetivo (</text>
  <text x="810" y="193" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;"> en B/s)</text>
  <path d="M 720 190 H 500 " fill="none" stroke="#1971c2" stroke-width="1.6"/>
  <path d="M 500 190 H 220" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f5flecha)"/>
  <text x="674.595" y="181.261" font-size="10.5" fill="#1971c2" text-anchor="middle" style="white-space: pre; font-size: 10.5px;">2. tasa objetivo</text>
  <text x="229.218" y="212.909" font-size="10.5" fill="#495057" style="white-space: pre; font-size: 10.5px;"> </text>
  <rect x="40" y="260" width="400" height="130" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.4" rx="8"/>
  <text x="240" y="284" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="bold" style="white-space: pre;">Fuera del contrato</text>
  <text x="60" y="308" font-size="10.5" fill="#495057" style="white-space: pre;">· identidad de la traza de red empleada</text>
  <text x="60" y="326" font-size="10.5" fill="#495057" style="white-space: pre;">· partición experimental a la que pertenece la traza (entrenamiento, evaluación...)</text>
  <text x="60" y="344" font-size="10.5" fill="#495057" style="white-space: pre;">· dureza de la ventana</text>
  <text x="60" y="362" font-size="10.5" fill="#495057" style="white-space: pre;">· throughput futuro</text>
  <text x="240" y="382" font-size="10" fill="#c92a2a" text-anchor="middle" font-style="italic" style="white-space: pre;">el controlador solo puede observar lo que se vería en un despliegue realista</text>
  <rect x="500" y="260" width="400" height="130" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="8"/>
  <text x="700" y="284" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Registro de controladores</text>
  <text x="520" y="308" font-size="10.5" fill="#495057" style="white-space: pre;">basado_en_tasa · bba · bola · mpc · mpc_robusto ·</text>
  <text x="520" y="324" font-size="10.5" fill="#1864ab" font-weight="bold" style="white-space: pre;">controlador_propio</text>
  <text x="511.266" y="348.672" font-size="10.5" fill="#495057" style="white-space: pre; font-size: 10.5px;">la configuración elige a través de el nombre y a continuación pasa los parámetros;</text>
  <text x="520" y="364" font-size="10.5" fill="#495057" style="white-space: pre;">para añadir un algoritmo hay que implementar la interfaz y registrarlo</text>
  <rect x="40" y="430" width="860" height="130" fill="#fff9db" stroke="#b08d00" stroke-width="1.4" rx="8"/>
  <text x="470" y="456" font-size="12" fill="#846200" text-anchor="middle" font-weight="bold" style="white-space: pre;">Respaldo para controladores que usan modelos predictivos</text>
  <rect x="70" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="195" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Máscara de acciones</text>
  <text x="195" y="510" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">la acción escogida tiene que ser una representación</text>
  <text x="195" y="524" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">valida y permitida</text>
  <rect x="345" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="470" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Respaldo a controlador clásico</text>
  <text x="470" y="510" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">si el modelo falla en algo,</text>
  <text x="470" y="524" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">pasa a un controlador clásico y se registra</text>
  <rect x="620" y="472" width="250" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1" rx="6"/>
  <text x="745" y="492" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Integridad del modelo</text>
  <text x="745" y="510" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">se verifica que el paquete del modelo empleado no</text>
  <text x="745" y="524" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">este corrupto</text>
  <text x="470" y="586" font-size="10.5" fill="#846200" text-anchor="middle" font-style="italic" style="white-space: pre;">por lo tanto: un controlador que haga uso de modelos de predicción no puede estropear una sesión; todas las decisiones se registran en la telemetría</text>
  <text x="363.389" y="213.652" font-size="10.5" fill="#1971c2" text-anchor="middle" style="white-space: pre; font-size: 10.5px; stroke-width: 1;">3. la tasa se traduce:se elige el escalón más alto ≤ objetivo</text>
</svg>