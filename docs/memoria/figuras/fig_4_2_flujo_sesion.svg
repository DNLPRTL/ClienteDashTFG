<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" font-family="Helvetica, Arial, sans-serif" xmlns:bx="https://boxy-svg.com">
  <defs>
    <marker id="f2flecha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="f2gris" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#868e96"/>
    </marker>
    <bx:export>
      <bx:file format="png" path="Sin título.png"/>
    </bx:export>
  </defs>
  <rect x="0" y="0" width="940" height="780" fill="#ffffff" id="object-0"/>
  <rect x="60" y="20" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="39" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">1. Carga y validación de la configuración</text>
  <text x="240" y="56" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">main.py y configuracion_cliente </text>
  <rect x="60" y="86" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="105" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">2. Se crea el contexto de ejecución</text>
  <text x="240" y="122" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">En el directorio de la sesión resulta: configuración, manifiesto y entorno</text>
  <rect x="60" y="152" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="171" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">3. Se unen las piezas de la sesión de reproducción</text>
  <text x="240" y="188" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">el controlador, motor y descargador (con trazas)</text>
  <rect x="60" y="218" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="237" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">4. Descarga y análisis del MPD</text>
  <text x="240" y="254" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">niveles disponibles y lista de segmentos por cada nivel</text>
  <rect x="60" y="284" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="303" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">5. Primera decisión del controlador</text>
  <text x="240" y="320" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">nivel de inicio, el primer segmento no cambia (calentamiento)</text>
  <line x1="240" y1="66" x2="240" y2="86" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <line x1="240" y1="132" x2="240" y2="152" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <line x1="240" y1="198" x2="240" y2="218" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <line x1="240" y1="264" x2="240" y2="284" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <line x1="240" y1="330" x2="240" y2="356" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <rect x="40" y="356" width="560" height="298" fill="none" stroke="#1971c2" stroke-width="1.8" rx="10"/>
  <text x="56" y="378" font-size="12" fill="#1971c2" font-weight="bold" style="white-space: pre;">BUCLE: Se repite en cada uno de los segmentos del vídeo</text>
  <rect x="70" y="390" width="500" height="40" fill="#ffffff" stroke="#495057" stroke-width="1.1" rx="6"/>
  <text x="320" y="406" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">a. Si el buffer se pasa de el máximo definido (60 s): debe esperar en pasos de 0,5 segundos</text>
  <text x="320" y="422" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">controla la ocupación antes de cada descarga</text>
  <rect x="70" y="440" width="500" height="40" fill="#ffffff" stroke="#495057" stroke-width="1.1" rx="6"/>
  <text x="320" y="456" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">b. Se descarga el segmento correspondiente al nivel actual (HTTP, y capacidad de reintentos,</text>
  <text x="320" y="472" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">si existe un fallo constante se disminuye de nivel)</text>
  <rect x="70" y="490" width="500" height="34" fill="#ffffff" stroke="#495057" stroke-width="1.1" rx="6"/>
  <text x="320" y="511" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">c. Los datos son entregados al motor de vídeo y se meten en el buffer</text>
  <rect x="70" y="534" width="500" height="40" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.3" rx="6"/>
  <text x="320" y="550" font-size="12" fill="#1864ab" text-anchor="middle" style="white-space: pre;">d. Se construye la realimentación y envia al controlador</text>
  <text x="320" y="566" font-size="10.5" fill="#1864ab" text-anchor="middle" style="white-space: pre;">Información acerca del buffer, la descarga, el ancho de banda, el nivel...</text>
  <rect x="70" y="584" width="500" height="26" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.3" rx="6"/>
  <text x="320" y="601" font-size="12" fill="#1864ab" text-anchor="middle" style="white-space: pre;">e. El controlador toma una decisión y escoge el nivel del próximo segmento</text>
  <rect x="70" y="618" width="500" height="26" fill="#ffffff" stroke="#495057" stroke-width="1.1" rx="6"/>
  <text x="320" y="635" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">f. Guarda la fila de telemetría de ese segmento</text>
  <line x1="320" y1="430" x2="320" y2="440" stroke="#495057" stroke-width="1.1" marker-end="url(#f2flecha)"/>
  <line x1="320" y1="480" x2="320" y2="490" stroke="#495057" stroke-width="1.1" marker-end="url(#f2flecha)"/>
  <line x1="320" y1="524" x2="320" y2="534" stroke="#495057" stroke-width="1.1" marker-end="url(#f2flecha)"/>
  <line x1="320" y1="574" x2="320" y2="584" stroke="#495057" stroke-width="1.1" marker-end="url(#f2flecha)"/>
  <line x1="320" y1="610" x2="320" y2="618" stroke="#495057" stroke-width="1.1" marker-end="url(#f2flecha)"/>
  <path d="M 570 631 H 588 V 410 H 570" fill="none" stroke="#1971c2" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <text x="580" y="524" font-size="10" fill="#1971c2" transform="rotate(-90 580 524)" text-anchor="middle" style="white-space: pre;">llega el próximo  segmento</text>
  <rect x="660" y="420" width="240" height="120" fill="#fff9db" stroke="#b08d00" stroke-width="1.2" rx="8"/>
  <text x="780" y="442" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Motor de vídeo (proceso asíncrono)</text>
  <text x="780" y="462" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">En el motor el buffer es consumido, hace que <tspan x="780" dy="1em">​</tspan>avance la reproducción del contenido</text>
  <text x="780" y="478" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <text x="780" y="500" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">genera tres tipos de eventos, stall, stall que se<tspan x="780" dy="1em">​</tspan>ha recuperado y cuando un segmento<tspan x="780" dy="1em">​</tspan>es consumido</text>
  <text x="780" y="516" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <line x1="661.016" y1="425.322" x2="600" y2="505" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f2gris)" style=""/>
  <line x1="700" y1="540" x2="620" y2="628" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f2gris)"/>
  <text x="673.599" y="589.969" font-size="10.5" fill="#868e96" style="white-space: pre; font-size: 10.5px;">los stalls son guardados en la telemetría</text>
  <line x1="240" y1="654" x2="240" y2="676" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <rect x="60" y="676" width="360" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="240" y="695" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">6. Termina el flujo: se vacía el buffer y detiene el motor</text>
  <text x="240" y="712" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">lo que queda pendiente se reproduce</text>
  <line x1="420" y1="699" x2="500" y2="699" stroke="#495057" stroke-width="1.3" marker-end="url(#f2flecha)"/>
  <rect x="500" y="676" width="400" height="46" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="700" y="695" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">7. Se generan los últimos artefactos de la sesión</text>
  <text x="700" y="712" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">en concreto, telemetria_segmentos.csv , segmentos_evaluacion.csv  y log</text>
  <rect x="660" y="80" width="240" height="96" fill="none" stroke="#adb5bd" stroke-width="1" rx="6"/>
  <text x="672" y="100" font-size="11" fill="#868e96" font-weight="bold" style="white-space: pre;">Leyenda</text>
  <rect x="672" y="110" width="26" height="13" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.2" rx="3"/>
  <text x="706" y="121" font-size="10.5" fill="#495057" style="white-space: pre;">bucle de toma de decisión ABR</text>
  <rect x="672" y="130" width="26" height="13" fill="#fff9db" stroke="#b08d00" stroke-width="1.2" rx="3"/>
  <text x="706" y="141" font-size="10.5" fill="#495057" style="white-space: pre;">proceso asíncrono</text>
  <line x1="672" y1="158" x2="698" y2="158" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="706" y="162" font-size="10.5" fill="#495057" style="white-space: pre;">notificación de eventos</text>
  <text x="632.594" y="349.15" font-size="10.5" fill="#868e96" style="white-space: pre; font-size: 10.5px; stroke-width: 1;" transform="matrix(1, 0, 0, 1, -21.323577, 46.708688)">el motor notifica <tspan x="632.593994140625" dy="1em">​</tspan>de la  ocupación<tspan x="632.593994140625" dy="1em">​</tspan>en el buffer</text>
</svg>