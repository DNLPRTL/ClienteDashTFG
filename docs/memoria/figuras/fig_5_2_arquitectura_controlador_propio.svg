<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="flAzul" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="flAmar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f08c00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- ================= COLUMNA A: ENTRADAS ================= -->
  <rect x="24" y="40" width="222" height="60" fill="#e9ecef" stroke="#868e96"/>
  <text x="135" y="64" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Realimentación del reproductor</text>
  <text x="135" y="82" font-size="11.5" fill="#495057" text-anchor="middle">(contrato de 20 claves, apartado 4.5)</text>

  <line x1="135" y1="100" x2="135" y2="128" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <rect x="24" y="130" width="222" height="188" fill="#f8f9fa" stroke="#868e96"/>
  <text x="135" y="152" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Constructor de entradas</text>
  <text x="36" y="176" font-size="11.5" fill="#212529">• secuencia: 5 últimas descargas</text>
  <text x="48" y="191" font-size="11" fill="#495057">(throughput, tiempo de descarga)</text>
  <text x="36" y="212" font-size="11.5" fill="#212529">• 7 escalares de sesión: buffer,</text>
  <text x="48" y="227" font-size="11" fill="#495057">último nivel y bitrate, cambio</text>
  <text x="48" y="242" font-size="11" fill="#495057">reciente, progreso de la sesión</text>
  <text x="36" y="266" font-size="11.5" fill="#212529">• máscara de acciones válidas</text>
  <text x="36" y="290" font-size="11.5" fill="#c92a2a">• rechaza los campos prohibidos</text>
  <text x="48" y="305" font-size="11" fill="#c92a2a">(identidad de traza, partición, futuro)</text>

  <!-- flecha A -> B -->
  <line x1="246" y1="224" x2="296" y2="224" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- ================= COLUMNA B: PREDICTOR ================= -->
  <rect x="300" y="40" width="330" height="378" fill="#f8f9fa" stroke="#868e96"/>
  <text x="465" y="62" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Predictor de cuantiles de throughput</text>

  <rect x="316" y="76" width="298" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="465" y="95" font-size="11.5" fill="#212529" text-anchor="middle">normalización (media y desviación del entrenamiento)</text>
  <line x1="465" y1="106" x2="465" y2="118" stroke="#495057" stroke-width="1.2" marker-end="url(#fl)"/>

  <rect x="316" y="120" width="140" height="44" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="386" y="138" font-size="11.5" fill="#212529" text-anchor="middle">GRU (96 unidades)</text>
  <text x="386" y="154" font-size="11" fill="#495057" text-anchor="middle">sobre la secuencia</text>
  <rect x="474" y="120" width="140" height="44" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="544" y="138" font-size="11.5" fill="#212529" text-anchor="middle">7 escalares</text>
  <text x="544" y="154" font-size="11" fill="#495057" text-anchor="middle">normalizados</text>
  <line x1="386" y1="164" x2="450" y2="186" stroke="#495057" stroke-width="1.2"/>
  <line x1="544" y1="164" x2="480" y2="186" stroke="#495057" stroke-width="1.2"/>

  <rect x="316" y="188" width="298" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="465" y="207" font-size="11.5" fill="#212529" text-anchor="middle">concatenación → MLP (96, 64) → 5 horizontes × 4 cuantiles</text>
  <line x1="465" y1="218" x2="465" y2="230" stroke="#495057" stroke-width="1.2" marker-end="url(#fl)"/>

  <rect x="316" y="232" width="298" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="465" y="251" font-size="11.5" fill="#212529" text-anchor="middle">cuantiles monótonos por construcción (q10 ≤ q25 ≤ q50 ≤ q75)</text>

  <!-- ensemble: cajas apiladas -->
  <rect x="330" y="278" width="270" height="18" fill="#ffffff" stroke="#adb5bd"/>
  <rect x="324" y="284" width="270" height="18" fill="#ffffff" stroke="#adb5bd"/>
  <rect x="318" y="290" width="270" height="18" fill="#ffffff" stroke="#adb5bd"/>
  <text x="453" y="303" font-size="11" fill="#212529" text-anchor="middle">× 5 miembros independientes (ensemble)</text>
  <line x1="465" y1="262" x2="465" y2="276" stroke="#495057" stroke-width="1.2" marker-end="url(#fl)"/>
  <line x1="465" y1="308" x2="465" y2="322" stroke="#495057" stroke-width="1.2" marker-end="url(#fl)"/>

  <rect x="316" y="324" width="298" height="46" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
  <text x="465" y="342" font-size="11.5" fill="#1971c2" font-weight="bold" text-anchor="middle">combinación: media por cuantil;</text>
  <text x="465" y="358" font-size="11" fill="#1971c2" text-anchor="middle">la cola inferior baja según el desacuerdo entre miembros</text>
  <line x1="465" y1="370" x2="465" y2="382" stroke="#495057" stroke-width="1.2" marker-end="url(#fl)"/>

  <rect x="316" y="384" width="298" height="26" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="465" y="401" font-size="11" fill="#212529" text-anchor="middle">a bit/s: base (media armónica) × e^ratio, acotado en [0,15×, 4×]</text>

  <!-- flecha B -> C -->
  <line x1="630" y1="224" x2="676" y2="224" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flAzul)"/>
  <text x="653" y="214" font-size="10.5" fill="#1971c2" text-anchor="middle">5 × 4</text>
  <text x="653" y="240" font-size="10.5" fill="#1971c2" text-anchor="middle">escenarios</text>

  <!-- ================= COLUMNA C: PLANIFICADOR + SALVAGUARDAS ================= -->
  <rect x="680" y="40" width="256" height="240" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
  <text x="808" y="62" font-size="12.5" font-weight="bold" fill="#1971c2" text-anchor="middle">Planificador MPC (CVaR)</text>
  <text x="692" y="88" font-size="11.5" fill="#212529">• enumera secuencias de 5 acciones</text>
  <text x="692" y="108" font-size="11.5" fill="#212529">• simula el buffer bajo cada cuantil</text>
  <text x="704" y="123" font-size="11" fill="#495057">con el tamaño real de cada segmento</text>
  <text x="692" y="145" font-size="11.5" fill="#212529">• puntúa cada escenario (QoE lineal)</text>
  <text x="692" y="167" font-size="11.5" fill="#212529">• CVaR con α = 0,75: media de los</text>
  <text x="704" y="182" font-size="11" fill="#495057">tres escenarios peores (q10, q25, q50)</text>
  <text x="692" y="204" font-size="11.5" fill="#212529">• aplica la primera acción de la</text>
  <text x="704" y="219" font-size="11" fill="#495057">mejor secuencia (horizonte deslizante)</text>
  <text x="692" y="244" font-size="11" fill="#495057">(apartado 5.6, segunda parte)</text>

  <line x1="808" y1="280" x2="808" y2="300" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <rect x="680" y="302" width="256" height="108" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="808" y="322" font-size="12.5" font-weight="bold" fill="#c92a2a" text-anchor="middle">Salvaguardas</text>
  <text x="692" y="344" font-size="11.5" fill="#212529">• acción dentro de la máscara</text>
  <text x="692" y="362" font-size="11.5" fill="#212529">• latencia de inferencia ≤ 50 ms</text>
  <text x="692" y="380" font-size="11.5" fill="#212529">• respaldo: MPC robusto (4.5)</text>
  <text x="692" y="398" font-size="11.5" fill="#212529">• diagnóstico por decisión → telemetría</text>

  <line x1="808" y1="410" x2="808" y2="440" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>
  <rect x="700" y="442" width="216" height="40" fill="#e9ecef" stroke="#868e96"/>
  <text x="808" y="459" font-size="11.5" fill="#212529" text-anchor="middle">tasa objetivo (bytes/s)</text>
  <text x="808" y="474" font-size="11" fill="#495057" text-anchor="middle">→ cuantización común del reproductor</text>

  <!-- ================= FILA INFERIOR: DATOS ================= -->
  <!-- paquete del modelo -->
  <rect x="300" y="456" width="330" height="74" fill="#fff9db" stroke="#f08c00"/>
  <text x="465" y="476" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">Paquete del modelo (bundle)</text>
  <text x="465" y="494" font-size="11" fill="#212529" text-anchor="middle">pesos de los 5 miembros · configuración del modelo ·</text>
  <text x="465" y="509" font-size="11" fill="#212529" text-anchor="middle">normalización · configuración del planificador ·</text>
  <text x="465" y="524" font-size="11" fill="#212529" text-anchor="middle">manifiesto con SHA-256 de cada fichero</text>
  <line x1="465" y1="456" x2="465" y2="422" stroke="#f08c00" stroke-width="1.5" marker-end="url(#flAmar)"/>

  <!-- tabla de tamaños del video activo -->
  <rect x="680" y="500" width="256" height="90" fill="#fff9db" stroke="#f08c00"/>
  <text x="808" y="520" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">Tabla de tamaños del vídeo activo</text>
  <text x="808" y="538" font-size="11" fill="#212529" text-anchor="middle">descriptor JSON: bytes reales de cada</text>
  <text x="808" y="553" font-size="11" fill="#212529" text-anchor="middle">segmento × representación (apartado 4.7)</text>
  <text x="808" y="571" font-size="11" fill="#212529" text-anchor="middle">un fichero por vídeo, inyectado por sesión (5.4)</text>
  <!-- flecha tabla -> planificador (bordea por la derecha) -->
  <line x1="936" y1="545" x2="948" y2="545" stroke="#f08c00" stroke-width="1.5"/>
  <line x1="948" y1="545" x2="948" y2="130" stroke="#f08c00" stroke-width="1.5"/>
  <line x1="948" y1="130" x2="940" y2="130" stroke="#f08c00" stroke-width="1.5" marker-end="url(#flAmar)"/>
  <text x="808" y="608" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="bold">el predictor no la ve: es un dato del planificador</text>

  <!-- nota anti-fuga bajo columna A -->
  <rect x="24" y="456" width="222" height="134" fill="#f8f9fa" stroke="#868e96" stroke-dasharray="5 3"/>
  <text x="135" y="478" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">Lo que el modelo NO ve</text>
  <text x="36" y="500" font-size="11" fill="#212529">• tamaños de segmento ni descriptor</text>
  <text x="48" y="515" font-size="11" fill="#495057">del contenido (agnóstico al vídeo)</text>
  <text x="36" y="535" font-size="11" fill="#212529">• identidad de la traza, partición,</text>
  <text x="48" y="550" font-size="11" fill="#495057">dificultad, throughput futuro</text>
  <text x="36" y="570" font-size="11" fill="#212529">• ningún resultado de evaluación</text>
</svg>
