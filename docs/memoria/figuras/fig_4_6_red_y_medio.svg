<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Helvetica, Arial, sans-serif" xmlns:bx="https://boxy-svg.com">
  <defs>
    <marker id="f6f" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <bx:export>
      <bx:file format="jpeg" path="Sin título.jpeg"/>
    </bx:export>
  </defs>
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
  <rect x="20" y="20" width="900" height="270" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="10"/>
  <text x="36" y="46" font-size="13" fill="#1971c2" font-weight="bold" style="white-space: pre;">LA RED — marca la llegada de los bits, se usan trazas reales de red para emularla</text>
  <rect x="40" y="66" width="200" height="88" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="140" y="88" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Corpus de trazas</text>
  <text x="140" y="106" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">6768 trazas normalizadas</text>
  <text x="140" y="121" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">12 grupos accesibles, públicos y reales</text>
  <text x="140" y="136" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">más sintéticas para diagnóstico</text>
  <rect x="290" y="66" width="210" height="88" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="395" y="88" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Diferentes grupos de trazas</text>
  <text x="395" y="106" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">entrenamiento / prueba / evaluación</text>
  <text x="395" y="121" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">ordenadas por grupos semánticos:</text>
  <text x="395" y="136" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">se evita el riesgo de fuga en la evaluación</text>
  <rect x="550" y="66" width="150" height="88" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="625" y="88" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Ventana</text>
  <text x="625" y="106" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">300 s de una traza</text>
  <text x="625" y="121" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">por sesión</text>
  <text x="625" y="136" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">(carácter determinista)</text>
  <line x1="240" y1="110" x2="290" y2="110" stroke="#495057" stroke-width="1.3" marker-end="url(#f6f)"/>
  <line x1="500" y1="110" x2="550" y2="110" stroke="#495057" stroke-width="1.3" marker-end="url(#f6f)"/>
  <line x1="700" y1="110" x2="750" y2="110" stroke="#495057" stroke-width="1.3" marker-end="url(#f6f)"/>
  <rect x="750" y="66" width="160" height="88" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.6" rx="6"/>
  <text x="830" y="88" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">Capa que envuelve a el</text>
  <text x="830" y="103" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">descargador</text>
  <text x="830" y="121" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">inyecta la traza y</text>
  <text x="830" y="135.312" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre; font-size: 10.5px;">guarda un tiempo antes</text>
  <rect x="40" y="176" width="870" height="94" fill="#ffffff" stroke="#1971c2" stroke-width="1.2" rx="8"/>
  <text x="475" y="200" font-size="11.5" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">Pasos en una descarga emulada</text>
  <text x="475" y="220" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">1. el segmento se descarga siempre del servidor      2. se calcula el tiempo que habría durado esa descarga</text>
  <text x="475" y="237" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">3. la entrega se para hasta llegar a esa duración   ·  4. la posición en las trazas avanzan con el tiempo real de la sesión</text>
  <text x="475" y="258" font-size="10.5" fill="#c92a2a" text-anchor="middle" font-style="italic" style="white-space: pre;">en caso de que se falle algo la sesión se detiene, as condiciones de red no se inventan</text>
  <rect x="20" y="310" width="900" height="240" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="10"/>
  <text x="36" y="336" font-size="13" fill="#b08d00" font-weight="bold" style="white-space: pre;">EL CONTENIDO — es medido y no se supone</text>
  <rect x="40" y="356" width="200" height="88" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="140" y="378" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Servidor DASH real</text>
  <text x="140" y="396" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">8 vídeos en el servidor</text>
  <text x="140" y="411" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">6 representaciones VBR cada uno</text>
  <text x="140" y="426" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">segmentos con duración de 4 s</text>
  <rect x="290" y="356" width="210" height="88" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="395" y="378" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Extractor de tamaños</text>
  <text x="395" y="396" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">se extrae la información del servidor a</text>
  <text x="395" y="411" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <text x="395" y="426" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <rect x="550" y="356" width="150" height="88" fill="#fff9db" stroke="#b08d00" stroke-width="1.4" rx="6"/>
  <text x="625" y="378" font-size="12" fill="#846200" text-anchor="middle" font-weight="bold" style="white-space: pre;">JSON VBR</text>
  <text x="625" y="396" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">almacena la información</text>
  <text x="625" y="411" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">de los bytes reales</text>
  <text x="625" y="426" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">por segmento</text>
  <line x1="240" y1="400" x2="290" y2="400" stroke="#495057" stroke-width="1.3" marker-end="url(#f6f)"/>
  <line x1="500" y1="400" x2="550" y2="400" stroke="#495057" stroke-width="1.3" marker-end="url(#f6f)"/>
  <rect x="750" y="336" width="160" height="60" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="830" y="358" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Entrenamiento</text>
  <text x="830" y="374" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">el simulador emplea</text>
  <text x="830" y="388" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">pesos realistas</text>
  <rect x="750" y="410" width="160" height="60" fill="#ffffff" stroke="#495057" stroke-width="1.2" rx="6"/>
  <text x="830" y="432" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Planificador </text>
  <text x="830" y="448" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;">aproxima las descargas con los <tspan x="830" dy="1em">​</tspan>pesos realistas</text>
  <text x="830" y="462" font-size="10" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <line x1="700" y1="385" x2="750" y2="366" stroke="#b08d00" stroke-width="1.2" marker-end="url(#f6f)"/>
  <line x1="700" y1="415" x2="750" y2="437" stroke="#b08d00" stroke-width="1.2" marker-end="url(#f6f)"/>
  <rect x="40" y="466" width="660" height="66" fill="#ffffff" stroke="#b08d00" stroke-width="1.2" rx="8"/>
  <text x="370" y="488" font-size="11" fill="#846200" text-anchor="middle" font-weight="bold" style="white-space: pre;">Por qué razón es importante: la codificación del contenido es VBR</text>
  <text x="370" y="506" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">la variación típica del tamaño es aproximadente del 10%</text>
  <text x="370" y="522" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <text x="470" y="596" font-size="12.5" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">Dos planos que no dependen entre sí: la traza marca el tempo; el contenido, el peso real.</text>
  <text x="470" y="616" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Se registra todo en la telemetría y siempre se descargan los bytes reales en el servidor</text>
  <text x="830.365" y="148.185" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre; stroke-width: 1; font-size: 10.5px;">antes de entregar</text>
  <text x="399.71" y="410.265" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre; stroke-width: 1; font-size: 10.5px;">través de HTTP</text>
  <text x="371.506" y="519.637" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre; stroke-width: 1; font-size: 10.5px;">llegando hasta el 16% en fragmentos de animación</text>
</svg>