<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="flAzul" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="flRojo" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- ================= FILA 1 ================= -->
  <!-- A: estado -->
  <rect x="24" y="44" width="176" height="120" fill="#e9ecef" stroke="#868e96"/>
  <text x="112" y="66" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Estado en el segmento k</text>
  <text x="36" y="90" font-size="11.5" fill="#212529">• ocupación del buffer B</text>
  <text x="36" y="108" font-size="11.5" fill="#212529">• último nivel elegido</text>
  <text x="36" y="126" font-size="11.5" fill="#212529">• 5 últimas descargas</text>
  <text x="36" y="144" font-size="11.5" fill="#212529">• máscara de acciones</text>
  <line x1="200" y1="104" x2="212" y2="104" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- B: prediccion (matriz) -->
  <rect x="214" y="44" width="224" height="120" fill="#f8f9fa" stroke="#868e96"/>
  <text x="326" y="64" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Predicción: 5 × 4 escenarios</text>
  <text x="262" y="84" font-size="10" fill="#495057" text-anchor="middle">q10</text>
  <text x="298" y="84" font-size="10" fill="#495057" text-anchor="middle">q25</text>
  <text x="334" y="84" font-size="10" fill="#495057" text-anchor="middle">q50</text>
  <text x="370" y="84" font-size="10" fill="#495057" text-anchor="middle">q75</text>
  <!-- rejilla 5 filas x 4 columnas -->
  <rect x="244" y="88" width="144" height="70" fill="#ffffff" stroke="#adb5bd"/>
  <line x1="280" y1="88" x2="280" y2="158" stroke="#adb5bd"/>
  <line x1="316" y1="88" x2="316" y2="158" stroke="#adb5bd"/>
  <line x1="352" y1="88" x2="352" y2="158" stroke="#adb5bd"/>
  <line x1="244" y1="102" x2="388" y2="102" stroke="#adb5bd"/>
  <line x1="244" y1="116" x2="388" y2="116" stroke="#adb5bd"/>
  <line x1="244" y1="130" x2="388" y2="130" stroke="#adb5bd"/>
  <line x1="244" y1="144" x2="388" y2="144" stroke="#adb5bd"/>
  <!-- columna q75 atenuada -->
  <rect x="352" y="88" width="36" height="70" fill="#e9ecef" fill-opacity="0.8"/>
  <text x="232" y="98" font-size="9.5" fill="#495057" text-anchor="middle">k+1</text>
  <text x="232" y="154" font-size="9.5" fill="#495057" text-anchor="middle">k+5</text>
  <text x="412" y="124" font-size="9.5" fill="#495057" text-anchor="middle">bit/s</text>
  <line x1="438" y1="104" x2="452" y2="104" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- C: simulacion por secuencia -->
  <rect x="454" y="44" width="270" height="120" fill="#f8f9fa" stroke="#868e96"/>
  <text x="589" y="62" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">Por cada secuencia de 5 acciones (6⁵ = 7776)</text>
  <text x="464" y="82" font-size="11" fill="#212529">y cada escenario q, simular la sesión:</text>
  <text x="464" y="100" font-size="11" fill="#212529">t = 8 · bytes reales(a, k+h) / throughput_q</text>
  <text x="464" y="117" font-size="11" fill="#212529">rebuffer = máx(t − B, 0)</text>
  <text x="464" y="134" font-size="11" fill="#212529">B ← mín(máx(B − t, 0) + 4 s, 60 s)</text>
  <text x="464" y="153" font-size="11" fill="#212529">puntuación_q += Mbit/s − 4,3·rebuffer − |ΔMbit/s|</text>
  <line x1="724" y1="104" x2="736" y2="104" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- D: 4 puntuaciones -->
  <rect x="738" y="44" width="198" height="120" fill="#f8f9fa" stroke="#868e96"/>
  <text x="837" y="64" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">4 puntuaciones por secuencia</text>
  <text x="837" y="84" font-size="10.5" fill="#495057" text-anchor="middle">(ejemplo ilustrativo)</text>
  <text x="837" y="106" font-size="11.5" fill="#212529" text-anchor="middle">q10: −1,2    q25: 0,9</text>
  <text x="837" y="126" font-size="11.5" fill="#212529" text-anchor="middle">q50: 2,1    q75: 2,6</text>
  <text x="837" y="150" font-size="10.5" fill="#495057" text-anchor="middle">una por escenario de throughput</text>
  <line x1="837" y1="164" x2="837" y2="212" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flAzul)"/>

  <!-- ================= FILA 2 ================= -->
  <!-- E: CVaR -->
  <rect x="738" y="214" width="198" height="90" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
  <text x="837" y="234" font-size="12.5" font-weight="bold" fill="#1971c2" text-anchor="middle">CVaR con α = 0,75</text>
  <text x="837" y="253" font-size="11" fill="#212529" text-anchor="middle">media de las 3 peores de 4:</text>
  <text x="837" y="271" font-size="11.5" fill="#212529" text-anchor="middle">(−1,2 + 0,9 + 2,1) / 3 = 0,6</text>
  <text x="837" y="291" font-size="10.5" fill="#495057" text-anchor="middle">el escenario optimista (q75) no cuenta</text>
  <line x1="738" y1="259" x2="726" y2="259" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flAzul)"/>

  <!-- F: mejor secuencia -->
  <rect x="454" y="214" width="270" height="90" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
  <text x="589" y="236" font-size="12.5" font-weight="bold" fill="#1971c2" text-anchor="middle">Mejor secuencia = máximo CVaR</text>
  <text x="589" y="258" font-size="11.5" fill="#212529" text-anchor="middle">se aplica solo su primera acción a₁</text>
  <text x="589" y="276" font-size="11" fill="#495057" text-anchor="middle">(horizonte deslizante: en el segmento</text>
  <text x="589" y="291" font-size="11" fill="#495057" text-anchor="middle">k+1 se vuelve a planificar desde cero)</text>
  <line x1="454" y1="259" x2="442" y2="259" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flAzul)"/>

  <!-- G: salvaguardas -->
  <rect x="214" y="214" width="224" height="90" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="326" y="234" font-size="12.5" font-weight="bold" fill="#c92a2a" text-anchor="middle">Salvaguardas</text>
  <text x="226" y="255" font-size="11" fill="#212529">• ¿a₁ dentro de la máscara?</text>
  <text x="226" y="272" font-size="11" fill="#212529">• ¿inferencia neuronal ≤ 50 ms?</text>
  <text x="226" y="289" font-size="11" fill="#212529">• ¿tasa finita y positiva?</text>
  <!-- si -> H -->
  <line x1="214" y1="259" x2="202" y2="259" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="207" y="250" font-size="10.5" fill="#495057" text-anchor="middle">sí</text>
  <!-- no -> I -->
  <line x1="326" y1="304" x2="326" y2="352" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#flRojo)"/>
  <text x="338" y="332" font-size="10.5" fill="#c92a2a">no</text>

  <!-- H: tasa objetivo -->
  <rect x="24" y="214" width="176" height="90" fill="#e9ecef" stroke="#868e96"/>
  <text x="112" y="240" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Tasa objetivo (bytes/s)</text>
  <text x="112" y="262" font-size="11" fill="#495057" text-anchor="middle">→ cuantización común</text>
  <text x="112" y="278" font-size="11" fill="#495057" text-anchor="middle">del reproductor (4.5)</text>

  <!-- ================= FILA 3 ================= -->
  <!-- I: respaldo -->
  <rect x="214" y="354" width="224" height="90" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="326" y="374" font-size="12.5" font-weight="bold" fill="#c92a2a" text-anchor="middle">Respaldo</text>
  <text x="326" y="394" font-size="11" fill="#212529" text-anchor="middle">MPC robusto con la misma</text>
  <text x="326" y="409" font-size="11" fill="#212529" text-anchor="middle">realimentación; si también falla,</text>
  <text x="326" y="424" font-size="11" fill="#212529" text-anchor="middle">la menor tasa válida. Nunca sin tasa.</text>
  <!-- I -> H (rodeo por la izquierda) -->
  <line x1="214" y1="399" x2="112" y2="399" stroke="#c92a2a" stroke-width="1.5"/>
  <line x1="112" y1="399" x2="112" y2="306" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#flRojo)"/>

  <!-- J: diagnostico -->
  <rect x="454" y="354" width="482" height="90" fill="#f8f9fa" stroke="#868e96" stroke-dasharray="5 3"/>
  <text x="695" y="376" font-size="12.5" font-weight="bold" fill="#212529" text-anchor="middle">Diagnóstico de la decisión → telemetría (25 campos)</text>
  <text x="695" y="398" font-size="11" fill="#212529" text-anchor="middle">paquete cargado y hashes correctos · entradas válidas · acciones válidas ·</text>
  <text x="695" y="414" font-size="11" fill="#212529" text-anchor="middle">acción bruta y acción segura · latencia de inferencia · respaldo usado y motivo</text>
  <text x="695" y="434" font-size="10.5" fill="#495057" text-anchor="middle">con o sin respaldo, toda decisión deja su rastro (auditoría del capítulo 6)</text>
  <line x1="589" y1="304" x2="589" y2="352" stroke="#495057" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#fl)"/>
  <line x1="438" y1="399" x2="452" y2="399" stroke="#495057" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#fl)"/>

  <!-- nota inferior -->
  <rect x="24" y="474" width="912" height="60" fill="#fff9db" stroke="#f08c00" stroke-width="0.8"/>
  <text x="36" y="494" font-size="11.5" fill="#212529">Los tamaños "bytes reales(a, k+h)" salen de la tabla del vídeo activo (apartado 4.7): el segmento concreto que tocaría descargar, no el nominal.</text>
  <text x="36" y="512" font-size="11.5" fill="#212529">Los valores de puntuación son ilustrativos; los parámetros (horizonte 5, α = 0,75, pesos 4,3 y 1, tope 60 s, límite 50 ms) son los de la evaluación (Tabla 5.6).</text>
  <text x="36" y="528" font-size="11" fill="#495057">Coste: 7776 secuencias × 4 escenarios × 5 pasos por decisión; latencia media de decisión del experimento ≈ 174 ms, de los que la inferencia neuronal es ≈ 1,3 ms.</text>
</svg>
