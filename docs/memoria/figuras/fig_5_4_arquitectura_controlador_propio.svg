<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="flAzul" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="flAmar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f08c00"/>
    </marker>
    <marker id="flRojo" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- ============ CARRIL 1: RED (observada) ============ -->
  <rect x="20" y="30" width="636" height="120" fill="#f1f3f5"/>
  <text x="30" y="47" font-size="11" font-weight="bold" fill="#495057" letter-spacing="0.5">INFORMACIÓN DE RED: OBSERVADA EN EL PASADO</text>

  <rect x="30" y="58" width="160" height="76" fill="#ffffff" stroke="#868e96"/>
  <text x="110" y="82" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">Realimentación</text>
  <text x="110" y="101" font-size="12.5" fill="#212529" text-anchor="middle">del reproductor</text>
  <text x="110" y="120" font-size="11" fill="#868e96" text-anchor="middle">(apartado 4.5)</text>
  <line x1="190" y1="96" x2="216" y2="96" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <rect x="218" y="58" width="200" height="76" fill="#ffffff" stroke="#868e96"/>
  <text x="318" y="82" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">Constructor de entradas</text>
  <text x="318" y="101" font-size="12.5" fill="#212529" text-anchor="middle">historial de 5 descargas</text>
  <text x="318" y="120" font-size="12.5" fill="#212529" text-anchor="middle">y 7 escalares de sesión</text>
  <line x1="418" y1="96" x2="444" y2="96" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <rect x="446" y="58" width="200" height="76" fill="#ffffff" stroke="#868e96"/>
  <text x="546" y="82" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">Predictor de cuantiles</text>
  <text x="546" y="101" font-size="12.5" fill="#212529" text-anchor="middle">conjunto de 5 redes GRU</text>
  <text x="546" y="120" font-size="11" fill="#868e96" text-anchor="middle">pesos verificados (SHA-256)</text>

  <!-- salida del predictor hacia el planificador -->
  <line x1="646" y1="96" x2="708" y2="96" stroke="#1971c2" stroke-width="1.8" marker-end="url(#flAzul)"/>
  <text x="677" y="86" font-size="11" font-weight="bold" fill="#1971c2" text-anchor="middle">5 × 4</text>
  <text x="677" y="113" font-size="10.5" fill="#1971c2" text-anchor="middle">escenarios</text>

  <!-- ============ CARRIL 2: CONTENIDO (conocido de antemano) ============ -->
  <rect x="20" y="172" width="636" height="98" fill="#fff9db"/>
  <text x="30" y="189" font-size="11" font-weight="bold" fill="#8a6d00" letter-spacing="0.5">INFORMACIÓN DEL CONTENIDO: CONOCIDA DE ANTEMANO</text>

  <rect x="30" y="200" width="616" height="58" fill="#ffffff" stroke="#f08c00"/>
  <text x="338" y="223" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">Tabla de tamaños reales del vídeo activo</text>
  <text x="338" y="243" font-size="12" fill="#212529" text-anchor="middle">bytes de cada segmento en cada representación · uno por vídeo · inyectado por sesión</text>
  <line x1="646" y1="229" x2="708" y2="229" stroke="#f08c00" stroke-width="1.8" marker-end="url(#flAmar)"/>

  <!-- ============ DECISION ============ -->
  <rect x="710" y="58" width="230" height="212" fill="#e7f0fa" stroke="#1971c2" stroke-width="2"/>
  <text x="825" y="82" font-size="13.5" font-weight="bold" fill="#1971c2" text-anchor="middle">Planificador MPC (CVaR)</text>
  <text x="825" y="110" font-size="12.5" fill="#212529" text-anchor="middle">7 776 secuencias de 5 acciones</text>
  <text x="825" y="129" font-size="12.5" fill="#212529" text-anchor="middle">× 4 escenarios de throughput</text>
  <text x="825" y="155" font-size="12.5" fill="#212529" text-anchor="middle">descarga simulada con el</text>
  <text x="825" y="174" font-size="12.5" fill="#212529" text-anchor="middle">tamaño real de cada segmento</text>
  <text x="825" y="200" font-size="12.5" fill="#212529" text-anchor="middle">elige el máximo CVaR (α = 0,75)</text>
  <text x="825" y="219" font-size="12.5" fill="#212529" text-anchor="middle">y aplica la primera acción</text>
  <text x="825" y="252" font-size="11" fill="#868e96" text-anchor="middle">(apartado 5.6.3)</text>

  <line x1="825" y1="270" x2="825" y2="300" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- ============ SALVAGUARDAS Y SALIDA ============ -->
  <rect x="710" y="302" width="230" height="70" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="825" y="324" font-size="13" font-weight="bold" fill="#c92a2a" text-anchor="middle">Salvaguardas</text>
  <text x="825" y="344" font-size="12" fill="#212529" text-anchor="middle">acción en la máscara · tasa válida</text>
  <text x="825" y="362" font-size="12" fill="#212529" text-anchor="middle">inferencia ≤ 50 ms</text>

  <line x1="710" y1="337" x2="654" y2="337" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#flRojo)"/>
  <text x="682" y="329" font-size="11" fill="#c92a2a" text-anchor="middle">fallo</text>

  <rect x="400" y="302" width="252" height="70" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="526" y="324" font-size="13" font-weight="bold" fill="#c92a2a" text-anchor="middle">Respaldo: MPC robusto</text>
  <text x="526" y="344" font-size="12" fill="#212529" text-anchor="middle">con la misma realimentación</text>
  <text x="526" y="362" font-size="12" fill="#212529" text-anchor="middle">(último recurso: tasa mínima)</text>

  <line x1="825" y1="372" x2="825" y2="410" stroke="#495057" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="834" y="395" font-size="11" fill="#495057">válida</text>
  <line x1="526" y1="372" x2="526" y2="410" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#flRojo)"/>

  <rect x="400" y="412" width="540" height="54" fill="#e9ecef" stroke="#868e96"/>
  <text x="670" y="434" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">Tasa objetivo → cuantización común del reproductor</text>
  <text x="670" y="454" font-size="12" fill="#495057" text-anchor="middle">cada decisión deja su diagnóstico en la telemetría (25 campos)</text>

  <!-- ============ LO QUE EL PREDICTOR NO RECIBE ============ -->
  <rect x="30" y="302" width="340" height="164" fill="#ffffff" stroke="#c92a2a" stroke-dasharray="5 3"/>
  <text x="44" y="326" font-size="12.5" font-weight="bold" fill="#c92a2a">Lo que el predictor no recibe</text>
  <text x="44" y="350" font-size="12" fill="#212529">• tamaños de segmento ni rasgos de la escena</text>
  <text x="44" y="372" font-size="12" fill="#212529">• identidad de la traza ni partición</text>
  <text x="44" y="394" font-size="12" fill="#212529">• throughput futuro ni resultados</text>
  <text x="44" y="420" font-size="11" fill="#495057">29 campos prohibidos, rechazados en</text>
  <text x="44" y="437" font-size="11" fill="#495057">ejecución (apartado 5.6.1)</text>
</svg>
