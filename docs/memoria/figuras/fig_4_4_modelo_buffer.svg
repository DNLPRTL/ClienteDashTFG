<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f4flecha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="f4azul" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="f4rojo" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="420" fill="#ffffff"/>

  <!-- productor -->
  <rect x="40" y="130" width="180" height="70" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.5" rx="8"/>
  <text x="130" y="158" font-size="12.5" fill="#1864ab" text-anchor="middle" font-weight="bold">Descargador</text>
  <text x="130" y="176" font-size="10.5" fill="#495057" text-anchor="middle">llena el buffer a ritmo</text>
  <text x="130" y="190" font-size="10.5" fill="#495057" text-anchor="middle">variable (según la red)</text>

  <line x1="220" y1="165" x2="290" y2="165" stroke="#1971c2" stroke-width="1.6" marker-end="url(#f4azul)"/>
  <text x="255" y="152" font-size="10.5" fill="#1971c2" text-anchor="middle">entrada</text>

  <!-- buffer -->
  <rect x="290" y="120" width="420" height="90" fill="#ffffff" stroke="#495057" stroke-width="1.6" rx="6"/>
  <!-- ocupacion ejemplo -->
  <rect x="292" y="122" width="240" height="86" fill="#dee2e6"/>
  <text x="412" y="170" font-size="11.5" fill="#212529" text-anchor="middle">segundos de vídeo almacenados</text>

  <!-- eje -->
  <line x1="290" y1="240" x2="710" y2="240" stroke="#868e96" stroke-width="1"/>
  <line x1="290" y1="234" x2="290" y2="246" stroke="#868e96" stroke-width="1"/>
  <line x1="710" y1="234" x2="710" y2="246" stroke="#868e96" stroke-width="1"/>
  <text x="274" y="262" font-size="10.5" fill="#495057" text-anchor="end">0 s</text>
  <text x="726" y="262" font-size="10.5" fill="#495057" text-anchor="start">60 s (tope)</text>

  <!-- umbral 0: stall -->
  <line x1="290" y1="120" x2="290" y2="228" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="120" y="280" width="300" height="52" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.2" rx="6"/>
  <text x="270" y="300" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="bold">Buffer vacío → stall</text>
  <text x="270" y="318" font-size="10.5" fill="#495057" text-anchor="middle">el motor detiene la reproducción y notifica</text>
  <line x1="286" y1="280" x2="288" y2="250" stroke="#c92a2a" stroke-width="1.2" marker-end="url(#f4rojo)"/>

  <!-- umbral 60: tope -->
  <line x1="710" y1="120" x2="710" y2="228" stroke="#b08d00" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="560" y="280" width="330" height="52" fill="#fff9db" stroke="#b08d00" stroke-width="1.2" rx="6"/>
  <text x="725" y="300" font-size="11.5" fill="#846200" text-anchor="middle" font-weight="bold">Ocupación &gt; 60 s → pausa de descarga</text>
  <text x="725" y="318" font-size="10.5" fill="#495057" text-anchor="middle">espera en pasos de 0,5 s hasta bajar del tope</text>
  <line x1="714" y1="280" x2="712" y2="250" stroke="#b08d00" stroke-width="1.2" marker-end="url(#f4flecha)"/>

  <!-- consumidor -->
  <line x1="710" y1="165" x2="780" y2="165" stroke="#495057" stroke-width="1.6" marker-end="url(#f4flecha)"/>
  <text x="745" y="152" font-size="10.5" fill="#495057" text-anchor="middle">salida</text>
  <rect x="780" y="130" width="140" height="70" fill="#f8f9fa" stroke="#495057" stroke-width="1.5" rx="8"/>
  <text x="850" y="158" font-size="12.5" fill="#212529" text-anchor="middle" font-weight="bold">Motor de vídeo</text>
  <text x="850" y="176" font-size="10.5" fill="#495057" text-anchor="middle">consume a velocidad</text>
  <text x="850" y="190" font-size="10.5" fill="#495057" text-anchor="middle">real (1×)</text>

  <!-- titulo y nota -->
  <text x="470" y="60" font-size="13.5" fill="#212529" text-anchor="middle" font-weight="bold">Buffer de reproducción (medido en tiempo de vídeo)</text>
  <text x="470" y="80" font-size="11" fill="#495057" text-anchor="middle">la dinámica de la sesión es la carrera entre el ritmo de llegada (red) y el consumo constante (reproducción)</text>

  <text x="470" y="376" font-size="10.5" fill="#868e96" text-anchor="middle">El controlador ABR observa la ocupación en cada decisión: buffer alto permite arriesgar más calidad;</text>
  <text x="470" y="392" font-size="10.5" fill="#868e96" text-anchor="middle">buffer bajo aconseja proteger la reproducción con niveles inferiores.</text>
</svg>
