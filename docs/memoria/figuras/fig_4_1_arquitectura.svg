<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Helvetica, Arial, sans-serif" xmlns:bx="https://boxy-svg.com">
  <defs>
    <marker id="flecha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="flechagris" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#868e96"/>
    </marker>
    <bx:export>
      <bx:file format="pdf" path="Sin título.pdf">
        <bx:page/>
      </bx:file>
    </bx:export>
  </defs>
  <rect y="0" width="940" height="660" fill="#ffffff" x="0"/>
  <rect x="20" y="18" width="900" height="86" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="8"/>
  <text x="34" y="40" font-size="12" fill="#868e96" font-weight="bold" style="white-space: pre;">RECEPCIÓN Y PREPARACIÓN DE LA SESIÓN</text>
  <rect x="60" y="50" width="200" height="42" fill="#ffffff" stroke="#495057" stroke-width="1.4" rx="6"/>
  <text x="160" y="68" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" style="white-space: pre;">main.py</text>
  <text x="160" y="84" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Punto de partida</text>
  <rect x="330" y="50" width="240" height="42" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="450" y="68" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">configuracion_cliente</text>
  <text x="450" y="84" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Carga y valida la configuración </text>
  <rect x="640" y="50" width="240" height="42" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="760" y="68" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">contexto_ejecucion</text>
  <text x="760" y="84" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Crea un directorio y manifiesto por sesión</text>
  <line x1="260" y1="71" x2="330" y2="71" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <line x1="570" y1="71" x2="640" y2="71" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <line x1="160" y1="92" x2="160" y2="270" stroke="#495057" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="168" y="150" font-size="11" fill="#495057" style="white-space: pre;">Es el núcleo del sistena </text>
  <text x="34" y="136" font-size="12" fill="#868e96" font-weight="bold" style="white-space: pre;">SESIÓN DE REPRODUCCIÓN</text>
  <rect x="330" y="150" width="250" height="52" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="455" y="171" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">core/analizador_mpd/</text>
  <text x="455" y="188" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Parsea el MPD, extrae niveles y segmentos</text>
  <rect x="60" y="270" width="200" height="120" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="160" y="298" font-size="14" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">Reproductor</text>
  <text x="160" y="316" font-size="11.5" fill="#1864ab" text-anchor="middle" style="white-space: pre;">(reproductor.py)</text>
  <text x="160" y="340" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Bucle de la sesión:</text>
  <text x="160" y="355" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Genera un segmento por iteración</text>
  <text x="160" y="370" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">y telemetría por cada segmento</text>
  <line x1="200" y1="270" x2="395" y2="202" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <text x="262" y="226" font-size="11" fill="#495057" style="white-space: pre;">mira el MPD</text>
  <rect x="330" y="240" width="250" height="52" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="455" y="261" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">core/descargador.py</text>
  <text x="455" y="278" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Descarga mediante HTTP </text>
  <line x1="260" y1="300" x2="330" y2="272" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <text x="270" y="272" font-size="11" fill="#495057" style="white-space: pre;">solicita segmentos</text>
  <rect x="640" y="228" width="250" height="76" fill="#fff9db" stroke="#b08d00" stroke-width="1.2" rx="6"/>
  <text x="765" y="250" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">core/reproduccion_trazas/</text>
  <text x="765" y="267" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">La red es controlada por las trazas,</text>
  <text x="765" y="282" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;" id="object-0">que limitan el caudal </text>
  <text x="765" y="297" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <line x1="640" y1="266" x2="580" y2="266" stroke="#b08d00" stroke-width="1.2" marker-end="url(#flecha)"/>
  <text x="586" y="256" font-size="10.5" fill="#b08d00" style="white-space: pre;" transform="matrix(1, 0, 0, 1, -2.585694, -9.481032)">envuelve<tspan x="586" dy="1em">​</tspan>al  descargador<tspan x="586" dy="1em">​</tspan><tspan x="586" dy="1em">​</tspan></text>
  <rect x="330" y="330" width="250" height="62" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="455" y="351" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">core/motores/</text>
  <text x="455" y="368" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Motor simulado y basado en GStreamer,</text>
  <text x="455" y="383" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">se crea el buffer y reproduce el  contenido</text>
  <line x1="260" y1="345" x2="330" y2="355" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <text x="266" y="338" font-size="11" fill="#495057" style="white-space: pre;">empuja los datos</text>
  <line x1="330" y1="375" x2="262" y2="382" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#flechagris)"/>
  <text x="252" y="404" font-size="10.5" fill="#868e96" style="white-space: pre;">devuelve eventos: stall (parada del vídeo) / recuperación / consumo</text>
  <rect x="60" y="452" width="330" height="96" fill="#e7f1fa" stroke="#1971c2" stroke-width="1.8" rx="8"/>
  <text x="225" y="476" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;">core/controladores/</text>
  <text x="225" y="494" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Define el contrato que establece como se comunican con<tspan x="225" dy="1em">​</tspan>el reproductor, el registro  que marca los controladores disponibles<tspan x="225" dy="1em">​</tspan> y la máscara de acciones que estipula las decisiones o acciones<tspan x="225" dy="1em">​</tspan>que pueden tomar los controladores<tspan x="225" dy="1em">​</tspan><tspan x="225" dy="1em">​</tspan></text>
  <text x="225" y="511" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <text x="225" y="528" font-size="11.5" fill="#1864ab" text-anchor="middle" font-weight="bold" style="white-space: pre;"> </text>
  <line x1="140" y1="390" x2="140" y2="452" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="16" y="420" font-size="11" fill="#1971c2" style="white-space: pre;">realimentación</text>
  <text x="16" y="434" font-size="10.5" fill="#868e96" style="white-space: pre;">(feedback_reproductor)</text>
  <line x1="185" y1="452" x2="185" y2="390" stroke="#1971c2" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="196" y="426" font-size="11" fill="#1971c2" style="white-space: pre;">tasa objetivo -&gt; nivel</text>
  <rect x="450.928" y="470" width="260.2" height="72.2" fill="#ffffff" stroke="#1971c2" stroke-width="1.2" rx="6" style=""/>
  <text x="575" y="491" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">core/modelo_propio/</text>
  <text x="581.491" y="508" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre; font-size: 11px;">Contiene el paquete de modelo de predicción y el<tspan x="581.4910278320312" dy="1em">​</tspan> planificador que toma la decisión. Esta configuración<tspan x="581.4910278320312" dy="1em">​</tspan>es única del controlador propio</text>
  <text x="575" y="523" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;"> </text>
  <line x1="390" y1="504" x2="450" y2="501" stroke="#1971c2" stroke-width="1.2" marker-end="url(#flecha)"/>
  <rect x="640" y="360" width="250" height="70" fill="#ffffff" stroke="#495057" stroke-width="1" rx="6"/>
  <text x="765" y="381" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">esquema_telemetria +</text>
  <text x="765" y="397" font-size="12.5" fill="#212529" text-anchor="middle" style="white-space: pre;">artefactos_salida</text>
  <text x="765" y="415" font-size="11" fill="#495057" text-anchor="middle" style="white-space: pre;">Se generan la telemetría y los logs</text>
  <path d="M 240 390 V 444 H 800 V 430" fill="none" stroke="#495057" stroke-width="1.2" marker-end="url(#flecha)"/>
  <text x="500" y="458" font-size="11" fill="#495057" style="white-space: pre;">una fila por cada uno de los segmentos</text>
  <rect x="20" y="570" width="900" height="74" fill="none" stroke="#868e96" stroke-width="1.2" stroke-dasharray="6 4" rx="8"/>
  <text x="34" y="592" font-size="12" fill="#868e96" font-weight="bold" style="white-space: pre;">FUERA DE LA SESIÓN DE REPRODUCCIÓN <tspan x="34" dy="1em">​</tspan><tspan x="34" dy="1em">​</tspan></text>
  <rect x="330" y="600" width="250" height="36" fill="#f8f9fa" stroke="#868e96" stroke-width="1" rx="6"/>
  <text x="455" y="616" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">core/evaluacion/</text>
  <text x="455" y="630" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">Análisis de la sesión de reproducción (QoE, gráficas) </text>
  <path d="M 765 430 V 560 H 500 V 600" fill="none" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#flechagris)"/>
  <text x="778" y="520" font-size="10.5" fill="#868e96" style="white-space: pre;">consume solo y exclusivamente<tspan x="778" dy="1em">​</tspan>la información de los CSV</text>
  <rect x="640" y="600" width="250" height="36" fill="#f8f9fa" stroke="#868e96" stroke-width="1" rx="6"/>
  <text x="765" y="616" font-size="12" fill="#212529" text-anchor="middle" style="white-space: pre;">entrenamiento/</text>
  <text x="765" y="630" font-size="10.5" fill="#495057" text-anchor="middle" style="white-space: pre;">Se fabrica el paquete del modelo predictivo</text>
  <line x1="700" y1="600" x2="645.564" y2="543.273" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#flechagris)" style=""/>
  <text x="585" y="588" font-size="10.5" fill="#868e96" style="white-space: pre;">crea el bundle</text>
</svg>